name: Knowledge Fabric PoC

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ingest sample sources and run the golden set
        run: python -m kfabric demo
      - uses: actions/upload-artifact@v4
        with:
          name: kfabric-report
          path: reports/latest.json
